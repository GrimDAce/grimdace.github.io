<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ti Amo</title>
<link id="favicon" rel="icon" href="">
<style>
:root{
  --bg:#f2f9ff; --panel:#ffffff; --panel-2:#f7fbff; --border:#dbeaf7; --text:#26384a; --muted:#7d93a8;
  --accent:#6cb8e8; --accent-dark:#3f97cf; --accent-bg:#e8f4fd; --accent-2:#ffc9d6; --accent-2-dark:#f08fa8;
  --ok:#57bf8a; --ok-bg:#e7f7ef; --warn:#e0a53c; --warn-bg:#fdf4e3; --danger:#e57b8d; --danger-bg:#fdecef;
  --on-accent:#ffffff; --on-accent-2:#7a3a4c; --glow:.75;
  --radius:16px; --shadow:0 4px 18px rgba(80,130,180,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Quicksand",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent-dark)}
/* ---------- klimatyczne tło ---------- */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(700px 380px at 12% -8%, var(--accent-bg), transparent 70%),
   radial-gradient(620px 420px at 105% 8%, var(--accent-2), transparent 72%),
   radial-gradient(560px 360px at 45% 112%, var(--accent-bg), transparent 70%);
  opacity:var(--glow)}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
/* ---------- sidebar ---------- */
.sidebar{width:246px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--accent-bg);flex-shrink:0}
.brand .bt{font-weight:800;font-size:19px;letter-spacing:.4px;line-height:1.1}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.3}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;transition:.14s;border:1px solid transparent}
.nav-item:hover{background:var(--accent-bg);color:var(--accent-dark)}
.nav-item.active{background:var(--accent-bg);color:var(--accent-dark);border-color:var(--accent);box-shadow:var(--shadow)}
.nav-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-sep{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:14px 12px 6px;font-weight:800;opacity:.7}
.nav-badge{margin-left:auto;background:var(--accent-2-dark);color:#fff;border-radius:99px;font-size:10.5px;font-weight:800;padding:1px 7px}
.sidefoot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1200px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:23px;margin:0;font-weight:800;letter-spacing:.2px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:3px;font-weight:500}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
.stat{padding:18px;text-align:center}
.stat .num{font-size:34px;font-weight:800;color:var(--accent-dark);line-height:1.05}
.stat .lbl{color:var(--muted);font-size:12.5px;margin-top:6px;font-weight:600}
.stat .ic{font-size:22px;margin-bottom:4px}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hr{border-top:1px solid var(--border);margin:16px 0}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-weight:700;font-size:13.5px;transition:.14s}
.btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(.93);color:var(--on-accent)}
.btn-soft{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent-dark)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:700}
input[type=text],input[type=password],input[type=search],select,textarea{
  width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--panel-2);color:var(--text);transition:.14s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-bg)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800}
.b-accent{background:var(--accent-bg);color:var(--accent-dark)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-love{background:var(--accent-2);color:var(--on-accent-2)}
.empty{text-align:center;color:var(--muted);padding:38px 14px;font-size:13.5px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:400;box-shadow:0 8px 26px rgba(0,0,0,.22)}
/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}
.login{background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:34px 30px;max-width:400px;width:100%;box-shadow:var(--shadow);text-align:center}
.login img.logo{width:104px;height:104px;object-fit:contain;margin-bottom:6px}
.login h1{font-size:32px;margin:0;font-weight:800;letter-spacing:1px}
.login .tag{color:var(--muted);font-size:13px;margin:8px 0 22px;font-style:italic;line-height:1.5}
.login label{text-align:left}
.login .btn{width:100%;margin-top:18px;padding:12px}
.hint{margin-top:20px;background:var(--accent-bg);border:1px dashed var(--accent);border-radius:14px;padding:13px 15px;font-size:12.5px;text-align:left;line-height:1.65;color:var(--accent-dark)}
.hint b{font-weight:800}
.hint code{background:var(--panel);padding:1px 7px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--text)}
.err{color:var(--danger);font-size:12.5px;margin-top:12px;font-weight:700;min-height:16px}
/* ---------- kalendarz ---------- */
.cal{width:100%;max-width:310px}
.cal .cal-h{text-align:center;font-weight:800;font-size:14px;margin-bottom:10px;color:var(--accent-dark)}
.cal table{width:100%;border-collapse:separate;border-spacing:2px}
.cal th{font-size:10.5px;color:var(--muted);font-weight:800;padding:2px;text-transform:uppercase}
.cal td{text-align:center;font-size:12.5px;padding:0;height:34px;width:14.28%;border-radius:9px;position:relative;font-weight:600}
.cal td.d{background:var(--panel-2)}
.cal td.mark{background:var(--accent-2);color:var(--on-accent-2);font-weight:800}
.cal td.mark2{background:var(--accent-bg);color:var(--accent-dark);font-weight:800}
.cal td .em{position:absolute;right:2px;bottom:0px;font-size:11px}
/* ---------- galeria ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.gal .th{aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--accent-bg);cursor:pointer;border:1px solid var(--border);position:relative;transition:.16s}
.gal .th:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.gal .th img{width:100%;height:100%;object-fit:cover;display:block}
.gal .th .idx{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.45);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px}
.lb{position:fixed;inset:0;background:rgba(15,25,35,.92);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb img{max-width:94vw;max-height:80vh;border-radius:14px;box-shadow:0 14px 50px rgba(0,0,0,.5)}
.lb .lbbar{display:flex;align-items:center;gap:16px;margin-top:16px;color:#fff;font-size:13px;font-weight:700}
.lb button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:12px;padding:9px 17px;cursor:pointer;font-weight:800;font-size:15px}
.lb button:hover{background:rgba(255,255,255,.28)}
.lb .cls{position:absolute;top:18px;right:20px}
/* ---------- gry ---------- */
.gamebox{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#000;box-shadow:var(--shadow)}
.gamebox iframe{width:100%;height:78vh;min-height:520px;border:0;display:block;background:#000}
/* ---------- quiz ---------- */
.qcard{max-width:760px;margin:0 auto}
.qimg{width:100%;height:290px;object-fit:cover;border-radius:14px;background:var(--accent-bg);display:block;margin-bottom:16px}
.qfall{width:100%;height:290px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:96px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--accent-bg),var(--accent-2))}
.qtxt{font-size:20px;font-weight:800;line-height:1.45;margin-bottom:6px}
.qprog{height:7px;background:var(--accent-bg);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.qprog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* ---------- czat ---------- */
.chat{display:flex;flex-direction:column;height:66vh;min-height:420px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.chat .log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px;background:var(--panel-2)}
.msg{max-width:74%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:var(--accent-bg);color:var(--accent-dark);font-size:12px;font-weight:700;max-width:88%;text-align:center;border-radius:10px}
.msg .who{font-size:10.5px;font-weight:800;opacity:.7;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.msg .tm{font-size:10px;opacity:.6;display:block;margin-top:5px}
.chat .bar{display:flex;gap:9px;padding:12px;border-top:1px solid var(--border);background:var(--panel)}
.chat .bar textarea{min-height:44px;max-height:130px;border-radius:12px}
/* ---------- motywy ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.tcard{border:2px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;text-align:center;background:var(--panel);transition:.16s}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tcard.on{border-color:var(--accent);box-shadow:var(--shadow)}
.tcard img{width:62px;height:62px;object-fit:contain;margin-bottom:9px}
.tcard .tn{font-weight:800;font-size:13.5px}
.tcard .sw{display:flex;gap:5px;justify-content:center;margin-top:9px}
.tcard .sw i{width:17px;height:17px;border-radius:50%;display:block;border:1px solid rgba(128,140,155,.35)}
/* ---------- czytanie ---------- */
.chaps{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chap{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);font-size:13px;font-weight:700;cursor:pointer;user-select:none;transition:.14s;color:var(--muted)}
.chap:hover{border-color:var(--accent);color:var(--accent-dark)}
.chap.done{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-dark)}
.chap.exact b{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.readerbar select,select[data-jump]{width:auto;min-width:150px;padding:8px 11px;font-weight:700;font-size:13px}
.chap b{font-weight:800;padding:0 1px}
.chap b:hover{text-decoration:underline}
.chap i{font-style:normal;font-size:11px;opacity:.7;padding:0 1px}
.chap i:hover{opacity:1;transform:scale(1.2)}
.chap a{text-decoration:none;font-size:11px;opacity:.6;padding:0 1px}
.chap a:hover{opacity:1}
.readerbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.readerbox{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.readerbox iframe{width:100%;height:80vh;min-height:560px;border:0;display:block;background:#fff}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:hover{opacity:.8}
code{background:var(--accent-bg);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
/* ---------- przełącznik jasny/ciemny ---------- */
.modeswitch{display:inline-flex;background:var(--accent-bg);border:1px solid var(--border);border-radius:99px;padding:4px;gap:4px}
.modeswitch button{border:none;background:transparent;color:var(--muted);font-weight:800;font-size:13px;padding:8px 18px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.modeswitch button:hover{color:var(--accent-dark)}
.modeswitch button.on{background:var(--panel);color:var(--accent-dark);box-shadow:var(--shadow)}
.modebtn{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:9px;padding:4px 9px;cursor:pointer;font-size:14px;line-height:1}
.modebtn:hover{border-color:var(--accent);background:var(--accent-bg)}
/* ---------- tabela ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:left;color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:9px 11px;border-bottom:1px solid var(--border)}
table.tb td{padding:11px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.55}
table.tb tr:last-child td{border-bottom:none}
.ans{background:var(--panel-2);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:9px 13px;margin-top:6px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 14px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:800;border-bottom:2px solid transparent}
.tab.active{color:var(--accent-dark);border-color:var(--accent)}
/* ---------- mobile ---------- */
.burger{display:none;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px 13px;cursor:pointer;font-size:17px}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:300;transform:translateX(-100%);transition:.22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sidebar.open{transform:none}
  .main{padding:16px 14px 80px}
  .burger{display:inline-flex}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}
  .qimg,.qfall{height:200px}.qfall{font-size:70px}
  .msg{max-width:88%}
  .gamebox iframe{height:70vh;min-height:440px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:299}
.scrim.on{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
</style>
</head>

/* --- ile dni razem --- */
function daysTogether(){
  const a = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const n = new Date(); const b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.max(0, Math.round((b-a)/86400000));
}
function prettyDuration(){
  const d = daysTogether();
  const y = Math.floor(d/365.2425);
  const m = Math.floor((d - y*365.2425)/30.44);
  const parts = [];
  if(y) parts.push(y + (y===1?' rok':(y<5?' lata':' lat')));
  if(m) parts.push(m + (m===1?' miesiąc':(m<5?' miesiące':' miesięcy')));
  return parts.join(' i ') || 'pierwsze dni';
}

/* --- mały kalendarz: na stałe marzec 2025 --- */
function miniCalendar(){
  const DOW = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
  const first = new Date(2025, 2, 1);
  let offset = (first.getDay() + 6) % 7;      // 1 III 2025 = sobota -> 5
  const days = 31;
  let cells = [];
  for(let i=0;i<offset;i++) cells.push('<td></td>');
  for(let d=1; d<=days; d++){
    if(d===27)      cells.push(`<td class="mark" title="27.03.2025 — nasz dzień">27<span class="em">❤️</span></td>`);
    else if(d===20) cells.push(`<td class="mark2" title="20.03 — urodziny">20<span class="em">🎂</span></td>`);
    else            cells.push(`<td class="d">${d}</td>`);
  }
  while(cells.length % 7) cells.push('<td></td>');
  let rows = '';
  for(let i=0;i<cells.length;i+=7) rows += '<tr>' + cells.slice(i,i+7).join('') + '</tr>';
  return `<div class="cal">
    <div class="cal-h">Marzec 2025</div>
    <table><thead><tr>${DOW.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:10px;line-height:1.7">
      <span class="badge b-love">❤️ 27</span> nasz początek<br>
      <span class="badge b-accent">🎂 20</span> twoje urodziny
    </div>
  </div>`;
}

/* --- losowanie pytań bez powtórek w obrębie sesji --- */
function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function queue(quizId){
  const k = 'tiamo_q_'+quizId+'_'+(USER?USER.login:'x');
  let q;
  try{ q = JSON.parse(sessionStorage.getItem(k)); }catch(e){}
  if(!q || !Array.isArray(q.order)) { q = { order: shuffled(100), at: 0 }; sessionStorage.setItem(k, JSON.stringify(q)); }
  return { get:()=>q, next:()=>{ q.at++; sessionStorage.setItem(k, JSON.stringify(q)); },
           reset:()=>{ q = { order: shuffled(100), at:0 }; sessionStorage.setItem(k, JSON.stringify(q)); } };
}

  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const LS_SHIM = `<script>(function(){
  try{ var t='__tiamo_probe'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); return; }catch(e){}
  var m={};
  try{ Object.defineProperty(window,'localStorage',{configurable:true,value:{
    getItem:function(k){ return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null; },
    setItem:function(k,v){ m[k]=String(v); },
    removeItem:function(k){ delete m[k]; },
    clear:function(){ m={}; },
    key:function(i){ return Object.keys(m)[i]||null; },
    get length(){ return Object.keys(m).length; }
  }}); }catch(e){}
})();<\/script>`;

   RolePlay — chatbot na Gemini (klucz osobny dla każdego konta)
   ============================================================ */
const GEM_MODELS = ['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash'];
const GEM_BASE   = 'https://generativelanguage.googleapis.com/v1beta';

async function gemPing(key){
  const r = await fetch(`${GEM_BASE}/models?key=${encodeURIComponent(key)}`);
  if(!r.ok){
    let d=''; try{ d=(await r.json()).error.message; }catch(e){}
    throw new Error(d || ('HTTP ' + r.status));
  }
  return true;
}
async function gemSend(key, model, sys, history){
  const r = await fetch(`${GEM_BASE}/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      systemInstruction:{ parts:[{text: sys}] },
      contents: history.map(m=>({ role: m.role==='user'?'user':'model', parts:[{text:m.text}] })),
      generationConfig:{ temperature:0.95, topP:0.95, maxOutputTokens:2048 },
      safetySettings:[
        {category:'HARM_CATEGORY_HARASSMENT',threshold:'BLOCK_ONLY_HIGH'},
        {category:'HARM_CATEGORY_HATE_SPEECH',threshold:'BLOCK_ONLY_HIGH'},
        {category:'HARM_CATEGORY_SEXUALLY_EXPLICIT',threshold:'BLOCK_ONLY_HIGH'},
        {category:'HARM_CATEGORY_DANGEROUS_CONTENT',threshold:'BLOCK_ONLY_HIGH'}
      ]
    })
  });
  const j = await r.json();
  if(!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  const c = j.candidates && j.candidates[0];
  const txt = c && c.content && c.content.parts && c.content.parts.map(p=>p.text||'').join('').trim();
  if(!txt) throw new Error('Model nie zwrócił odpowiedzi' + (c && c.finishReason ? ' (' + c.finishReason + ')' : '') + '.');
  return txt;
}

/* ============================================================
   Czytanie — biblioteka serii + czytnik w ramce.
   Strona trzyma wyłącznie adresy i postęp czytania; same plansze
   zostają u źródła i wyświetlają się prosto z niego.
   ============================================================ */
const DN_BASE = 'https://comix.to/title/ge21g-dreadful-night';
const SEED_LIBRARY = () => ([{
  id:'dreadful-night',
  title:'Dreadful Night',
  emoji:'🌙',
  url: DN_BASE,
  pattern: DN_BASE + '?cm_id={id}',
  chapters: Array.from({length:80}, (_,i)=>({ n:i+1, done:false, cid:'' }))
}]);
function uLib(u){
  if(!DB.library) DB.library = {};
  if(!DB.library[u]) DB.library[u] = SEED_LIBRARY();
  migrateLib(DB.library[u]);
  return DB.library[u];
}
/* Przeniesienie starych bibliotek na comix.to bez gubienia odhaczonych rozdziałów. */
function migrateLib(lib){
  const s = lib.find(x=>x.id==='dreadful-night');
  if(!s || !/yaoiscan/i.test(s.url + ' ' + (s.pattern||''))) return;
  const done = new Set(s.chapters.filter(c=>c.done).map(c=>c.n));
  s.url = DN_BASE; s.pattern = DN_BASE + '?cm_id={id}';
  s.chapters = Array.from({length:80}, (_,i)=>({ n:i+1, done:done.has(i+1), cid:'' }));
  save();
}
/* Adres rozdziału: dokładny, gdy znamy jego ID; inaczej strona serii,
   na której spis rozdziałów pokazuje się w samej ramce. */
function chapUrl(s, c){
  if(c && c.cid && (s.pattern||'').includes('{id}')) return s.pattern.replace(/\{id\}/g, c.cid);
  if((s.pattern||'').includes('{n}') && c) return s.pattern.replace(/\{n\}/g, c.n);
  return s.url;
}
const findSeries = sid => uLib(USER.login).find(x=>x.id===sid);

  const prev = idx>0 ? s.chapters[idx-1] : null;

    <div class="card" style="margin-top:14px">

           </div>
           <div class="row" style="margin-top:10px">
             <input type="text" id="cidInput" inputmode="numeric" placeholder="np. 5548862">
             <button class="btn btn-primary btn-sm" data-save-cid="${s.id}|${n}" style="flex:0 0 auto">Zapisz ID rozdziału ${n}</button>
           </div>`}
      <div class="small muted" style="margin-top:12px">
        Czytasz z: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a><br>
        Jeśli okno wyżej zostaje puste, źródło zabrania wyświetlania się w ramce — wtedy działa „Otwórz w nowej karcie ↗”.
      </div>
    </div>`;
}

/* ---------------- biblioteka ---------------- */
function viewRead(){
  if(state.reader) return viewReader();
  const lib = uLib(USER.login);
  const totalCh = lib.reduce((a,s)=>a+s.chapters.length,0);
  const doneCh  = lib.reduce((a,s)=>a+s.chapters.filter(c=>c.done).length,0);

  const cards = lib.length ? lib.map(s=>{
    const done = s.chapters.filter(c=>c.done).length, all = s.chapters.length;
    const withId = s.chapters.filter(c=>c.cid).length;
    const pct = all ? Math.round(done/all*100) : 0;
    const next = s.chapters.find(c=>!c.done);
    const chips = all ? s.chapters.map(c=>`
        <span class="chap ${c.done?'done':''} ${c.cid?'exact':''}">
          <b data-open="${s.id}|${c.n}" title="Czytaj rozdział ${c.n}">${c.n}</b>
          <i data-ch="${s.id}|${c.n}" title="${c.done?'Odznacz':'Oznacz jako przeczytany'}">${c.done?'✓':'○'}</i>
          <a href="${esc(chapUrl(s,c))}" target="_blank" rel="noopener" title="Otwórz w nowej karcie">↗</a>
        </span>`).join('')
      : `<div class="empty" style="padding:18px">Nie ma jeszcze żadnych rozdziałów — dodaj je poniżej.</div>`;

    return `<div class="card">
      <div class="section-title">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:34px">${s.emoji||'📖'}</div>
          <div><h2 style="margin:0">${esc(s.title)}</h2>
            <div class="small muted">${all?`${done} z ${all} rozdziałów · ${pct}%`:'brak rozdziałów'}</div></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${all?`<select data-jump="${s.id}" title="Przejdź do rozdziału">
            <option value="">Przejdź do…</option>
            ${s.chapters.map(c=>`<option value="${c.n}">${c.done?'✓ ':''}Rozdział ${c.n}</option>`).join('')}
          </select>`:''}
          ${next?`<button class="btn btn-primary btn-sm" data-open="${s.id}|${next.n}">Czytaj dalej: ${next.n}</button>`:''}
          <a class="btn btn-sm" href="${esc(s.url)}" target="_blank" rel="noopener">Strona serii ↗</a>
          <button class="btn btn-sm btn-danger" data-lib-del="${s.id}">Usuń</button>
        </div>
      </div>
      <div class="qprog"><i style="width:${pct}%"></i></div>
      <div class="chaps">${chips}</div>
      <div class="hr"></div>
      <details>
        <summary class="small" style="cursor:pointer;font-weight:800;color:var(--accent-dark)">⚙️ Rozdziały, adresy i ID (${withId} z ${all} rozdziałów ma dokładne ID)</summary>
        <div class="row" style="margin-top:12px;flex-wrap:wrap">
          <div style="min-width:90px"><label>Od</label><input type="text" inputmode="numeric" id="from-${s.id}" value="${all?Math.max(...s.chapters.map(c=>c.n))+1:1}"></div>
          <div style="min-width:90px"><label>Do</label><input type="text" inputmode="numeric" id="to-${s.id}" value="${all?Math.max(...s.chapters.map(c=>c.n))+10:20}"></div>
        </div>
        <label>Wzór adresu rozdziału <span style="text-transform:none;font-weight:600">— <code>{id}</code> dla ID z comix.to, <code>{n}</code> dla numeru</span></label>
        <input type="text" id="pat-${s.id}" value="${esc(s.pattern||'')}">
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" data-lib-add="${s.id}">Dodaj rozdziały</button>
          <button class="btn btn-sm" data-lib-mark="${s.id}|1">Odhacz wszystkie</button>
          <button class="btn btn-sm" data-lib-mark="${s.id}|0">Odznacz wszystkie</button>
        </div>
        <label>Wklej ID rozdziałów hurtem <span style="text-transform:none;font-weight:600">— po jednym w linii, od rozdziału 1; puste linie pomijają rozdział</span></label>
        <textarea id="bulk-${s.id}" placeholder="5548862&#10;5548863&#10;..."></textarea>
        <button class="btn btn-sm" style="margin-top:10px" data-bulk-cid="${s.id}">Zapisz ID</button>
      </details>
    </div>`;
  }).join('') : `<div class="card"><div class="empty">Biblioteka jest pusta — dodaj pierwszą serię poniżej.</div></div>`;

  return `${topbar('Czytanie', `${doneCh} z ${totalCh} rozdziałów przeczytanych 📖`)}
    ${cards}
    <div class="card">
      <details>
        <summary class="small" style="cursor:pointer;font-weight:800;color:var(--accent-dark)">➕ Dodaj nową serię</summary>
        <label for="nsTitle">Tytuł</label><input type="text" id="nsTitle" placeholder="np. Dreadful Night">
        <label for="nsUrl">Adres strony serii</label><input type="text" id="nsUrl" placeholder="https://...">
        <label for="nsPat">Wzór adresu rozdziału (z <code>{n}</code> lub <code>{id}</code>)</label><input type="text" id="nsPat" placeholder="https://.../chapter-{n}">
        <button class="btn btn-primary" style="margin-top:14px" id="nsAdd">Dodaj serię</button>
      </details>
    </div>`;
}

/* ---------------- zdarzenia ---------------- */
function bindRead(){
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = ()=>{
    const [sid, n] = el.dataset.open.split('|');
    state.reader = { sid, n: Number(n) }; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll('[data-reader-close]').forEach(el => el.onclick = ()=>{ state.reader = null; render(); });
  document.querySelectorAll('[data-jump]').forEach(el => el.onchange = ()=>{
    if(!el.value) return;
    state.reader = { sid: el.dataset.jump, n: Number(el.value) }; render(); window.scrollTo(0,0);
  });
  on('chapJump','change', ()=>{
    state.reader = { sid: state.reader.sid, n: Number($('chapJump').value) }; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll('[data-ch]').forEach(el => el.onclick = ()=>{
    const [sid, n] = el.dataset.ch.split('|');
    const s = findSeries(sid); if(!s) return;
    const c = s.chapters.find(x=>String(x.n)===n); if(!c) return;
    c.done = !c.done; save(); render();
  });
  document.querySelectorAll('[data-save-cid]').forEach(el => el.onclick = ()=>{
    const [sid, n] = el.dataset.saveCid.split('|');
    const v = ($('cidInput').value||'').trim().replace(/^.*cm_id=/,'').replace(/[^\w-].*$/,'');
    if(!v){ toast('Wklej ID rozdziału'); return; }
    const s = findSeries(sid); if(!s) return;
    const c = s.chapters.find(x=>String(x.n)===n); if(!c) return;
    c.cid = v; save(); render(); toast(`Zapisano ID rozdziału ${n}`);
  });
  document.querySelectorAll('[data-clear-cid]').forEach(el => el.onclick = e=>{
    e.preventDefault();
    const [sid, n] = el.dataset.clearCid.split('|');
    const s = findSeries(sid); if(!s) return;
    const c = s.chapters.find(x=>String(x.n)===n); if(c){ c.cid=''; save(); render(); }
  });
  document.querySelectorAll('[data-bulk-cid]').forEach(el => el.onclick = ()=>{
    const sid = el.dataset.bulkCid, s = findSeries(sid); if(!s) return;
    const lines = ($('bulk-'+sid).value||'').split('\n');
    let set = 0;
    lines.forEach((raw,i)=>{
      const v = raw.trim().replace(/^.*cm_id=/,'').replace(/[^\w-].*$/,'');
      if(!v) return;
      const c = s.chapters[i];
      if(c){ c.cid = v; set++; }
    });
    save(); render(); toast(set ? `Przypisano ID do ${set} rozdziałów` : 'Nie znalazłem żadnych ID');
  });
  document.querySelectorAll('[data-lib-add]').forEach(el => el.onclick = ()=>{
    const sid = el.dataset.libAdd, s = findSeries(sid); if(!s) return;
    const a = parseInt($('from-'+sid).value,10), b = parseInt($('to-'+sid).value,10);
    const pat = $('pat-'+sid).value.trim();
    if(!Number.isFinite(a) || !Number.isFinite(b) || b < a){ toast('Podaj poprawny zakres rozdziałów'); return; }
    if(b - a > 999){ toast('Za duży zakres — maksymalnie 1000 rozdziałów naraz'); return; }
    s.pattern = pat;
    let added = 0;
    for(let n = a; n <= b; n++){
      if(s.chapters.some(c=>c.n===n)) continue;
      s.chapters.push({ n, done:false, cid:'' }); added++;
    }
    s.chapters.sort((x,y)=>x.n-y.n);
    save(); render(); toast(added ? `Dodano ${added} rozdziałów` : 'Te rozdziały już są na liście');
  });
  document.querySelectorAll('[data-lib-mark]').forEach(el => el.onclick = ()=>{
    const [sid, v] = el.dataset.libMark.split('|');
    const s = findSeries(sid); if(!s) return;
    s.chapters.forEach(c=>c.done = v==='1'); save(); render();
  });
  document.querySelectorAll('[data-lib-del]').forEach(el => el.onclick = ()=>{
    const sid = el.dataset.libDel, lib = uLib(USER.login);
    const s = lib.find(x=>x.id===sid); if(!s) return;
    if(!confirm(`Usunąć „${s.title}” z biblioteki razem z postępem czytania?`)) return;
    DB.library[USER.login] = lib.filter(x=>x.id!==sid); save(); render(); toast('Usunięto z biblioteki');
  });
  on('nsAdd','click', ()=>{
    const t = $('nsTitle').value.trim(), u = $('nsUrl').value.trim(), p = $('nsPat').value.trim();
    if(!t){ toast('Podaj tytuł serii'); return; }
    uLib(USER.login).push({ id: uid(), title:t, emoji:'📖', url:u, pattern:p, chapters:[] });
    save(); render(); toast('Dodano serię 📖');
  });
}
/* ============================================================
   Router + zdarzenia
   ============================================================ */
function render(){
  const root = document.getElementById('root');
  if(!USER){
    applyTheme('cinnamoroll', !!DB.lastDark);
    root.innerHTML = viewLogin();
    bindLogin();
    return;
  }
  applyTheme(uTheme(USER.login), uDark(USER.login));
  const allowed = (USER.role==='admin' ? NAV_ADMIN : NAV_USER).filter(n=>n.id).map(n=>n.id);
  if(!allowed.includes(state.tab)) state.tab = 'dash';

  let main = '';
  switch(state.tab){
    case 'dash':    main = viewDash(); break;
    case 'photos':  main = viewPhotos(); break;
    case 'game1':
    case 'game2':
    case 'game3':
    case 'game4':   main = viewGame(state.tab); break;
    case 'read':    main = viewRead(); break;
    case 'quiz1':   main = viewQuiz('q1'); break;
    case 'quiz2':   main = viewQuiz('q2'); break;
    case 'rp':      main = viewRp(); break;
    case 'theme':   main = viewTheme(); break;
    case 'chat':    main = viewChat(); break;
    case 'results': main = viewResults(); break;
    default:        main = viewDash();
  }
  root.innerHTML = `<div class="scrim ${state.sideOpen?'on':''}" id="scrim"></div>
    <div class="app">${renderSidebar()}<main class="main" id="main">${main}</main></div>`;
  bindApp();
  renderLightbox();
  if(GAMES[state.tab]) mountGame(state.tab);
  const lg = document.getElementById('chatLog'); if(lg) lg.scrollTop = lg.scrollHeight;
  const rl = document.getElementById('rpLog');   if(rl) rl.scrollTop = rl.scrollHeight;
}
function go(tab){ state.tab = tab; state.sideOpen = false; state.lb = null; state.reader = null; render(); }
const $ = id => document.getElementById(id);
const on = (id, ev, fn) => { const e = $(id); if(e) e.addEventListener(ev, fn); };

function bindLogin(){
  const f = $('loginForm');
  f.addEventListener('submit', e=>{
    e.preventDefault();
    const l = $('lg').value.trim(), p = $('pw').value;
    const found = Object.keys(ACCOUNTS).find(k => k.toLowerCase() === l.toLowerCase());
    if(found && checkPass(found, p)){
      setSession({ login: found, role: ACCOUNTS[found].role, label: ACCOUNTS[found].label });
      state = { tab:'dash', sideOpen:false, lb:null, resTab:'q1', busy:false, reader:null };
      render(); toast('Cześć, ' + found + '! 💙');
    } else {
      $('loginErr').textContent = 'Nieprawidłowy login lub hasło.';
      $('pw').value = ''; $('pw').focus();
    }
  });
  $('lg').focus();
}

function bindApp(){
  document.querySelectorAll('[data-tab]').forEach(el => el.onclick = ()=> go(el.dataset.tab));
  on('logoutBtn','click', ()=>{ logout(); toast('Do zobaczenia 💙'); });
  on('burgerBtn','click', ()=>{ state.sideOpen = !state.sideOpen; render(); });
  on('scrim','click', ()=>{ state.sideOpen = false; render(); });

  /* --- galeria --- */
  document.querySelectorAll('[data-photo]').forEach(el =>
    el.onclick = ()=>{ state.lb = Number(el.dataset.photo); renderLightbox(); });

  /* --- gry --- */
  on('gameReload','click', ()=>{ mountGame(state.tab); toast('Gra uruchomiona od nowa'); });

  /* --- quizy --- */
  document.querySelectorAll('[data-quiz-save]').forEach(el => el.onclick = ()=>{
    const quizId = el.dataset.quizSave, idx = Number(el.dataset.idx);
    const val = $('qa').value.trim();
    if(!val){ toast('Napisz coś albo pomiń pytanie 🙂'); $('qa').focus(); return; }
    uAns(USER.login)[quizId][idx] = { a: val, at: nowIso() };
    save(); queue(quizId).next(); render(); toast('Zapisane 💾');
  });
  document.querySelectorAll('[data-quiz-skip]').forEach(el => el.onclick = ()=>{
    queue(el.dataset.quizSkip).next(); render();
  });
  document.querySelectorAll('[data-quiz-reset]').forEach(el => el.onclick = ()=>{
    queue(el.dataset.quizReset).reset(); render(); toast('Wylosowano nową kolejność 🔁');
  });

  /* --- wyniki --- */
  document.querySelectorAll('[data-restab]').forEach(el => el.onclick = ()=>{ state.resTab = el.dataset.restab; render(); });
  on('exportRes','click', exportResults);

  /* --- motywy --- */
  document.querySelectorAll('[data-theme]').forEach(el => el.onclick = ()=>{
    DB.theme[USER.login] = el.dataset.theme; save(); render();
    const t = THEMES[el.dataset.theme];
    toast('Motyw: ' + t.name + ' ' + t.emoji + (uDark(USER.login) ? ' 🌙' : ' ☀️'));
  });
  const setMode = dark => {
    DB.dark[USER.login] = dark; DB.lastDark = dark; save(); render();
    toast(dark ? 'Ciemna wersja 🌙' : 'Jasna wersja ☀️');
  };
  document.querySelectorAll('[data-mode]').forEach(el => el.onclick = ()=> setMode(el.dataset.mode === 'dark'));
  on('modeQuick','click', ()=> setMode(!uDark(USER.login)));

  /* --- wiadomości --- */
  const sendMsg = ()=>{
    const t = $('msgInput').value.trim(); if(!t) return;
    DB.msgs.push({ id: uid(), from: USER.login, to: otherUser(), text: t, at: nowIso(), read: false });
    save(); render(); toast('Wysłane 💌');
  };
  on('sendMsg','click', sendMsg);
  on('msgInput','keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
  on('clearChat','click', ()=>{
    if(!confirm('Usunąć całą rozmowę? Tego nie da się cofnąć.')) return;
    DB.msgs = []; save(); render(); toast('Rozmowa wyczyszczona');
  });

  bindRp();
  bindRead();
}

function bindRp(){
  /* --- podłączenie Gemini --- */
  on('gemConnect','click', async ()=>{
    const key = $('gemKey').value.trim(), model = $('gemModel').value;
    const err = $('gemErr'), btn = $('gemConnect');
    if(!key){ err.textContent = 'Wklej klucz API.'; return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Sprawdzam…';
    try{
      await gemPing(key);
      const rp = uRp(USER.login);
      rp.key = key; rp.model = model; rp.ok = true;
      save(); render(); toast('Gemini podłączone ✅');
    }catch(e){
      err.textContent = 'Nie udało się połączyć: ' + e.message;
      btn.disabled = false; btn.textContent = 'Połącz konto Gemini';
    }
  });
  on('gemForget','click', ()=>{
    if(!confirm('Odłączyć konto Gemini i skasować zapisany klucz?')) return;
    DB.rp[USER.login] = { key:'', model:'gemini-2.5-flash', ok:false, char:null, chat:[] };
    save(); render(); toast('Gemini odłączone');
  });

  /* --- start sesji --- */
  on('rpStart','click', ()=>{
    const topic = $('rpTopic').value.trim(), genre = $('rpGenre').value;
    const name = $('rpName').value.trim(), desc = $('rpDesc').value.trim(), powers = $('rpPowers').value.trim();
    const err = $('rpErr');
    if(!topic || !name || !desc){ err.textContent = 'Uzupełnij temat, imię i opis postaci.'; return; }
    if(/fantasy|science/i.test(genre) && !powers){
      err.textContent = 'Przy fantasy i science fiction opisz moce i umiejętności postaci.'; return;
    }
    const rp = uRp(USER.login);
    rp.char = { topic, genre, name, desc, powers }; rp.chat = [];
    save(); render(); toast('Sesja rozpoczęta 🎬');
  });
  on('rpReset','click', ()=>{
    if(!confirm('Zakończyć obecną sesję i stworzyć nową postać? Historia rozmowy zniknie.')) return;
    const rp = uRp(USER.login); rp.char = null; rp.chat = [];
    save(); render();
  });

  /* --- wysyłka wiadomości do mistrza gry --- */
  const rpSend = async ()=>{
    if(state.busy) return;
    const inp = $('rpInput'); const t = inp.value.trim(); if(!t) return;
    const rp = uRp(USER.login);
    rp.chat.push({ role:'user', text:t }); save();
    inp.value = ''; state.busy = true; render();
    try{
      const reply = await gemSend(rp.key, rp.model, rpSystemPrompt(rp.char), rp.chat);
      rp.chat.push({ role:'model', text: reply });
    }catch(e){
      rp.chat.push({ role:'model', text: '⚠️ Błąd połączenia z Gemini: ' + e.message +
        '\n\nSprawdź klucz API w zakładce RolePlay albo spróbuj ponownie za chwilę.' });
    }
    state.busy = false; save(); render();
  };
  on('rpSend','click', rpSend);
  on('rpInput','keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); rpSend(); } });
  const ri = $('rpInput'); if(ri && !state.busy) ri.focus();
}

/* --- lightbox: klawiatura + klik --- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-lb]');
  if(b){
    const a = b.dataset.lb;
    if(a==='close') state.lb = null;
    if(a==='prev')  state.lb = (state.lb - 1 + DATA.PHOTOS.length) % DATA.PHOTOS.length;
    if(a==='next')  state.lb = (state.lb + 1) % DATA.PHOTOS.length;
    renderLightbox(); return;
  }
  if(e.target.id === 'lbOverlay'){ state.lb = null; renderLightbox(); }
});
document.addEventListener('keydown', e=>{
  if(state.lb === null) return;
  if(e.key === 'Escape')     { state.lb = null; renderLightbox(); }
  if(e.key === 'ArrowLeft')  { state.lb = (state.lb - 1 + DATA.PHOTOS.length) % DATA.PHOTOS.length; renderLightbox(); }
  if(e.key === 'ArrowRight') { state.lb = (state.lb + 1) % DATA.PHOTOS.length; renderLightbox(); }
});

/* --- start --- */
loadSession();
if(USER && !ACCOUNTS[USER.login]) USER = null;
render();
if(!STORAGE_OK) setTimeout(()=>toast('Uwaga: przeglądarka blokuje zapis danych — odpowiedzi nie przetrwają odświeżenia.'), 900);
</script>
